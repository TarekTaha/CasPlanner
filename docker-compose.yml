# Opens CasPlanner and the Stage simulator on the host display.
# Run this from a graphical session so DISPLAY and XAUTHORITY are set.
# The login cookie is mounted into both containers; xhost is not required.
x-display: &display
  environment: &display-env
    DISPLAY: ${DISPLAY:-:0}
    XAUTHORITY: /tmp/.Xauthority
    QT_X11_NO_MITSHM: "1"
  volumes: &display-volumes
    - /tmp/.X11-unix:/tmp/.X11-unix
    - ${XAUTHORITY:?Set XAUTHORITY, or run docker compose from a graphical session}:/tmp/.Xauthority:ro
services:
  stage:
    image: casplanner:local
    working_dir: /opt/casplanner/StageSim
    command: ["player", "casarea.cfg"]
    environment:
      <<: *display-env
      PLAYERPATH: /usr/local/lib
    volumes: *display-volumes
    network_mode: host
  casplanner:
    image: casplanner:local
    build: .
    working_dir: /opt/casplanner
    command: ["./CasPlanner", "wheelchair.cfg"]
    depends_on:
      - stage
    environment:
      <<: *display-env
      QT_QPA_PLATFORM: xcb
    volumes: *display-volumes
    network_mode: host
